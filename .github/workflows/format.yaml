name: Format Code
on:
  workflow_dispatch:
  push:
    branches:
      - fix/ci-eslint-test-violations

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run Prettier write
        run: bunx prettier --write .

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: automatic prettier formatting" || echo "No changes to commit"
          git push
