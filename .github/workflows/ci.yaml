name: ci

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]
  workflow_dispatch: # Adicione esta linha

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run ci
