# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: ci

on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run ci
